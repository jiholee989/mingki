[project]
name = "mingki"
version = "0.1.0"
description = "법령 개정에 따른 상품별 변경 제안과 사람 검토 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.150.0",
    "fastmcp>=4.1.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
