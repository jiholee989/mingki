[project]
name = "mingki"
version = "0.1.0"
description = "법령 개정에 따른 상품별 변경 제안과 사람 검토 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
