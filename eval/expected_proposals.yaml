# 채점 규칙
#   products   : 12개 상품 모두 판정이 있어야 한다. impact가 같아야 정답.
#                change_required는 rule_id · proposed(value, unit)도 같아야 정답.
#                basis_any는 근거로 인정하는 조항 ("{regulation_id}/{article_id}"). keep · needs_check는 이유 근거로 채점.
#   must_not   : 이 rule_id에 낸 변경 제안은 오답 (trap: true는 함정)
#   bonus      : follow_up · extra · contracts는 가산점. 채점 제외 항목은 info

