plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.ruleripple'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Docker Engine 29 는 옛 API 버전을 받지 않는다. Boot 3.3 이 고른 Testcontainers 1.19 는 Docker 를 못 찾고 통합 테스트를 건너뛴다
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat 'full'
    }
    // 통합 테스트는 Docker 가 없으면 조용히 건너뛴다. 로그에 수를 남기고, CI 에서는 건너뛴 테스트가 있으면 실패시킨다
    afterSuite { desc, result ->
        if (desc.parent == null) {
            logger.lifecycle("테스트 ${result.testCount}개: 통과 ${result.successfulTestCount} · 실패 ${result.failedTestCount} · 건너뜀 ${result.skippedTestCount}")
            if (System.getenv('CI') && result.skippedTestCount > 0) {
                throw new GradleException("CI 에서 건너뛴 테스트가 ${result.skippedTestCount}개 있습니다 (Docker 를 못 찾았는지 확인)")
            }
        }
    }
}
